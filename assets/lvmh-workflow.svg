<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350" role="img" aria-labelledby="t d"><title id="t">LVMUY price-analysis workflow</title><desc id="d">Prices retrieved with quantmod feed ARIMA and lagged regression, evaluated in distinct contexts.</desc><rect width="960" height="350" fill="#faf9f6"/><g font-family="Arial,sans-serif" fill="#243b36"><text x="40" y="48" font-size="27">LVMUY price analysis</text><text x="40" y="80" font-size="16">Daily prices · October 2020–October 2024</text><rect x="40" y="125" width="265" height="125" rx="9" fill="#e4eae3"/><text x="60" y="162" font-size="20">Yahoo Finance → quantmod</text><text x="60" y="193" font-size="18">LVMUY daily OHLCV</text><text x="60" y="223" font-size="16">Automatic retrieval and local cache</text><path d="M320 185 H375" stroke="#243b36" stroke-width="2"/><path d="M365 177 L375 185 L365 193" fill="none" stroke="#243b36" stroke-width="2"/><text x="400" y="137" font-size="22">Full-series ARIMA → 60-step forecast</text><text x="400" y="168" font-size="16">Evaluation: in-sample residual RMSE</text><text x="400" y="224" font-size="22">Lag5 + Volume → chronological 80/20</text><text x="400" y="255" font-size="16">Evaluation: regression test RMSE</text><text x="40" y="316" font-size="16">Each error measure describes its own evaluation sample.</text></g></svg>